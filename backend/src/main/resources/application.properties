spring.application.name=medbox-backend
server.port=${PORT:8080}

# Folder with catalogue.json and leaflets/ (relative to where you start the app)
medbox.data-dir=${MEDBOX_DATA_DIR:../data}

# Gemini (vision). The key comes ONLY from the environment. Never write it here.
gemini.api-key=${GEMINI_API_KEY:}
# Check the current model id in Google AI Studio and set GEMINI_MODEL if it differs.
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:150}

# Vision call log (logs/vision.jsonl), git-ignored
medbox.log-dir=${MEDBOX_LOG_DIR:logs}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
